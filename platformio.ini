; PlatformIO Project Configuration File
;
;   HMI de captacion de pozos profundos - version 7"
;   Placa: Panlee ZX7D00CE01SV13 (WT32-S3-WROVER-N16R8, 16MB flash / 8MB PSRAM octal)
;   Pantalla: RGB565 paralelo 800x480 (LovyanGFX Bus_RGB/Panel_RGB) - Tactil: GT911 capacitivo (I2C)
;   GUI: LVGL 8.4, renderizada a 320x240 logico y escalada 2.5x/2.0x a la pantalla fisica
;        (ver src/hal/display.cpp) -- mismo layout que miHMI, solo mas grande. Sin
;        redisenar todavia (a proposito, ver README.md).
;
; Pines segun el repo oficial del fabricante (Shenzhen QM Smart Panlee, placa "SC05"):
;   https://github.com/smartpanle/PanelLan_esp32_arduino/blob/master/src/board/sc05/sc05_pin.h

[env:panlee-zx7d00ce01sv13]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

board_build.partitions = partitions_16mb_ota.csv
board_build.filesystem = littlefs
; WROVER-N16R8: 16MB flash, 8MB PSRAM octal (OPI)
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600
; upload_port / monitor_port: fija el COM de tu banco aqui cuando lo conectes
; upload_port = COM13
; monitor_port = COM13

lib_deps =
	lvgl/lvgl @ ^8.4.0
	lovyan03/LovyanGFX @ ^1.1.16
	emelianov/modbus-esp8266 @ ^4.1.0     ; cliente Modbus TCP -> Mapa B (LOGO! 9 / PLC-SIM)
	bblanchon/ArduinoJson @ ^7.0.4        ; queda para /api local o exports futuros (sin microSD en esta placa)

build_flags =
	-D BOARD_HAS_PSRAM
	-mfix-esp32-psram-cache-issue
	-D CORE_DEBUG_LEVEL=0
	; FW_VERSION_OVERRIDE lo inyecta el CI (.github/workflows/release.yml) desde el tag vX.Y.Z
	${sysenv.EXTRA_BUILD_FLAGS}
	; ----- LVGL: usar lv_conf.h del proyecto (include/) -----
	-D LV_CONF_INCLUDE_SIMPLE
	-I include
	-I src
	; ----- LovyanGFX: sin autodeteccion, la placa se define en src/hal/lgfx_panel.h -----
	-D LGFX_USE_V1
